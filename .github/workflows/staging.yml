name: Validate staging
on:
  push:
    branches: [staging]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node scripts/export-pages.mjs
        env:
          FIVE_STARS_ENV: test
