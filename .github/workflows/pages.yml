name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Validate staging]
    types: [completed]
    branches: [staging]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node scripts/export-pages.mjs
      - uses: actions/checkout@v4
        with:
          ref: staging
          path: .staging
      - run: npm test
        working-directory: .staging
      - run: node scripts/export-pages.mjs
        working-directory: .staging
        env:
          FIVE_STARS_ENV: test
      - name: Compose production and test sites
        run: node -e "const fs=require('node:fs');fs.rmSync('dist/test',{recursive:true,force:true});fs.cpSync('.staging/dist','dist/test',{recursive:true})"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
