name: Validate voting changes
on:
  push:
    branches: [improve-voting-save-and-load-tests]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node --check public/app.js
      - run: node --check public/stats.js
      - run: node scripts/export-pages.mjs
        env:
          FIVE_STARS_ENV: test
