const people=[{"id":"p0","name":"Josh"},{"id":"p1","name":"Noa Tikochinsky"},{"id":"p2","name":"אביב סלנט"},{"id":"p3","name":"אביגיל"},{"id":"p4","name":"אביעד"},{"id":"p5","name":"אדם של תמר גורפינקל"},{"id":"p6","name":"אודליה וורטמן"},{"id":"p7","name":"אוהדי רוני"},{"id":"p8","name":"אופק ינאי"},{"id":"p9","name":"אורי דולב"},{"id":"p10","name":"אורי לבנור"},{"id":"p11","name":"אורילה"},{"id":"p12","name":"איילה פתחי"},{"id":"p13","name":"איילת בן שבת"},{"id":"p14","name":"איתי ארז"},{"id":"p15","name":"איתי שפר"},{"id":"p16","name":"אלחנן כהן"},{"id":"p17","name":"אלמוג גואטה"},{"id":"p18","name":"אריאל קאוואי של תמר"},{"id":"p19","name":"אריק צ'וקולטיאנסקי"},{"id":"p20","name":"בנו מהאינדינגב"},{"id":"p21","name":"בתיוש"},{"id":"p22","name":"דנה מרחוביץ'"},{"id":"p23","name":"הילה תואר"},{"id":"p24","name":"הרובון"},{"id":"p25","name":"זוהר הראל"},{"id":"p26","name":"חמצני"},{"id":"p27","name":"חנה מיכל"},{"id":"p28","name":"טליה שינדלר"},{"id":"p29","name":"יהונתן בן אריה"},{"id":"p30","name":"יואב אלמוג"},{"id":"p31","name":"יואב יהושוע שמה"},{"id":"p32","name":"יובל בסין"},{"id":"p33","name":"יובל של טליה"},{"id":"p34","name":"יותם רמון"},{"id":"p35","name":"יעל פוגל"},{"id":"p36","name":"יערה"},{"id":"p37","name":"יערה סגל עידן"},{"id":"p38","name":"יפעת וינרדאו"},{"id":"p39","name":"לא אופירה"},{"id":"p40","name":"מוריה עמר"},{"id":"p41","name":"מיכלי"},{"id":"p42","name":"נגה בר אור"},{"id":"p43","name":"נדב ריבקין של כרמל"},{"id":"p44","name":"נועהלי"},{"id":"p45","name":"נועם קסר"},{"id":"p46","name":"נני"},{"id":"p47","name":"נעה גז"},{"id":"p48","name":"נעם אטלי"},{"id":"p49","name":"נעם מאורי"},{"id":"p50","name":"נעם מזובר"},{"id":"p51","name":"סבא אמיר"},{"id":"p52","name":"עדו דולב"},{"id":"p53","name":"עדן של מיכל"},{"id":"p54","name":"עמיר כיסראוי"},{"id":"p55","name":"עמית אילת"},{"id":"p56","name":"עמר מבית הספר יחד"},{"id":"p57","name":"קשץ"},{"id":"p58","name":"רונאז'י"},{"id":"p59","name":"רונילה"},{"id":"p60","name":"רועי אהלי"},{"id":"p61","name":"רועי כהן מגן"},{"id":"p62","name":"רועידהוקי"},{"id":"p63","name":"שולה"},{"id":"p64","name":"שחר שפירא"},{"id":"p65","name":"שני חברה של נעם מזובר"},{"id":"p66","name":"שקד דותן"},{"id":"p67","name":"תומר אמויאל"},{"id":"p68","name":"תומר של אהלי"},{"id":"p69","name":"תמר גורפינקל"},{"id":"p70","name":"תמר טיקוצ׳ינסקי"},{"id":"p71","name":"תמרי"}];
const key='five-stars:name-list:v1';
let draft={};let persistent=true;
try{draft=JSON.parse(localStorage.getItem(key)||'{}');}catch{persistent=false;}
const message=document.querySelector('#message');
function feedback(text){message.textContent=text;}
function changes(){return people.map(p=>{const name=document.querySelector('[data-name="'+p.id+'"]').value.trim();const remove=document.querySelector('[data-remove="'+p.id+'"]').checked;return {id:p.id,originalName:p.name,name:remove?'':name,action:remove?'remove':name===p.name?'keep':'rename'};});}
function save(){draft=Object.fromEntries(changes().map(p=>[p.id,{name:p.name,remove:p.action==='remove'}]));try{localStorage.setItem(key,JSON.stringify(draft));persistent=true;}catch{persistent=false;}const count=changes().filter(p=>p.action!=='keep').length;feedback(count+' שינויים · '+(persistent?'טיוטה במכשיר הזה':'לא נשמר — יש להעתיק או להוריד לפני הסגירה'));}
for(const p of people){const d=draft[p.id];if(d){document.querySelector('[data-name="'+p.id+'"]').value=d.remove?p.name:(d.name??p.name);document.querySelector('[data-remove="'+p.id+'"]').checked=!!d.remove;}}
document.querySelectorAll('[data-name],[data-remove]').forEach(input=>input.addEventListener('input',save));
document.querySelector('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.name-row').forEach(row=>{const p=people.find(p=>p.id===row.dataset.id);row.hidden=!((p.name+' '+row.querySelector('[data-name]').value).toLowerCase().includes(q));});};
function valid(){const empty=changes().find(p=>p.action!=='remove'&&!p.name);if(empty){feedback('יש למלא שם או לסמן להסרה: '+empty.originalName);document.querySelector('[data-name="'+empty.id+'"]').focus();return false;}return true;}
