put id="name-p66" data-name="p66" value="שקד דותן" aria-label="איך לקרוא לשקד דותן" autocomplete="off"><label class="remove"><input type="checkbox" data-remove="p66">להסיר</label></div></section><section class="name-row" data-id="p67"><label for="name-p67"><span class="number">51</span><span dir="auto">תומר אמויאל</span></label><div class="edit-row"><input id="name-p67" data-name="p67" value="תומר אמויאל" aria-label="איך לקרוא לתומר אמויאל" autocomplete="off"><label class="remove"><input type="checkbox" data-remove="p67">להסיר</label></div></section><section class="name-row" data-id="p69"><label for="name-p69"><span class="number">52</span><span dir="auto">תמר גורפינקל</span></label><div class="edit-row"><input id="name-p69" data-name="p69" value="תמר גורפינקל" aria-label="איך לקרוא לתמר גורפינקל" autocomplete="off"><label class="remove"><input type="checkbox" data-remove="p69">להסיר</label></div></section><section class="name-row" data-id="p71"><label for="name-p71"><span class="number">53</span><span dir="auto">תמר קוה</span></label><div class="edit-row"><input id="name-p71" data-name="p71" value="תמר קוה" aria-label="איך לקרוא לתמר קוה" autocomplete="off"><label class="remove"><input type="checkbox" data-remove="p71">להסיר</label></div></section></div><textarea id="copy-text" aria-label="שינויים להעתקה" readonly hidden></textarea></main><footer><div class="footer-inner"><div class="buttons"><button id="copy">העתקת השינויים</button><button id="download">הורדת הרשימה</button></div><p id="message" role="status" aria-live="polite"></p></div></footer><script>
const people=[{"id":"p1","name":"Noa Tikochinsky"},{"id":"p2","name":"אביב סלנט"},{"id":"p3","name":"אביגיל"},{"id":"p4","name":"אביעד"},{"id":"p6","name":"אודליה וורטמן"},{"id":"p7","name":"אוהד"},{"id":"p9","name":"אורי דולב"},{"id":"p10","name":"אורי לבנור"},{"id":"p11","name":"אורי מרגלית"},{"id":"p13","name":"איילת בן שבת"},{"id":"p14","name":"איתי ארז"},{"id":"p15","name":"איתי שפר"},{"id":"p16","name":"אלחנן כהן"},{"id":"p19","name":"אריק צ'וקולטיאנסקי"},{"id":"p20","name":"בנו"},{"id":"p21","name":"בתיה"},{"id":"p22","name":"דנה מרחוביץ'"},{"id":"p24","name":"איתמר"},{"id":"p25","name":"זוהר הראל"},{"id":"p27","name":"חנה מיכל"},{"id":"p28","name":"טליה שינדלר"},{"id":"p29","name":"יהונתן בן אריה"},{"id":"p30","name":"יואב אלמוג"},{"id":"p32","name":"יובל בסין"},{"id":"p35","name":"יעל פוגל"},{"id":"p39","name":"אופיר כהן"},{"id":"p41","name":"מיכל"},{"id":"p43","name":"נדב ריבקין"},{"id":"p44","name":"נועה ליברמן"},{"id":"p46","name":"נני"},{"id":"p47","name":"נעה גז"},{"id":"p48","name":"נעם אטלי"},{"id":"p49","name":"נעם מאורי"},{"id":"p50","name":"נעם מזובר"},{"id":"p51","name":"אמיר"},{"id":"p52","name":"עדו דולב"},{"id":"p53","name":"עדן"},{"id":"p54","name":"עמיר כיסראוי"},{"id":"p55","name":"עמית אילת"},{"id":"p56","name":"עמר בן אביב"},{"id":"p57","name":"קשת"},{"id":"p58","name":"רוני אליאסיאן"},{"id":"p59","name":"רוני וקסלר"},{"id":"p60","name":"רועי אהלי"},{"id":"p61","name":"רועי כהן מגן"},{"id":"p62","name":"רועי דהוקי"},{"id":"p63","name":"שולה"},{"id":"p64","name":"שחר שפירא"},{"id":"p65","name":"שני"},{"id":"p66","name":"שקד דותן"},{"id":"p67","name":"תומר אמויאל"},{"id":"p69","name":"תמר גורפינקל"},{"id":"p71","name":"תמר קוה"}];
const key='five-stars:name-list:v2';
let draft={};let persistent=true;
try{draft=JSON.parse(localStorage.getItem(key)||'{}');}catch{persistent=false;}
const message=document.querySelector('#message');
function feedback(text){message.textContent=text;}
function changes(){return people.map(p=>{const name=document.querySelector('[data-name="'+p.id+'"]').value.trim();const remove=document.querySelector('[data-remove="'+p.id+'"]').checked;return {id:p.id,originalName:p.name,name:remove?'':name,action:remove?'remove':name===p.name?'keep':'rename'};});}
function save(){draft=Object.fromEntries(changes().map(p=>[p.id,{name:p.name,remove:p.action==='remove'}]));try{localStorage.setItem(key,JSON.stringify(draft));persistent=true;}catch{persistent=false;}const count=changes().filter(p=>p.action!=='keep').length;feedback(count+' שינויים · '+(persistent?'טיוטה במכשיר הזה':'לא נשמר — יש להעתיק או להוריד לפני הסגירה'));}
for(const p of people){const d=draft[p.id];if(d){document.querySelector('[data-name="'+p.id+'"]').value=d.remove?p.name:(d.name??p.name);document.querySelector('[data-remove="'+p.id+'"]').checked=!!d.remove;}}
document.querySelectorAll('[data-name],[data-remove]').forEach(input=>input.addEventListener('input',save));
document.querySelector('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.name-row').forEach(row=>{const p=people.find(p=>p.id===row.dataset.id);row.hidden=!((p.name+' '+row.querySelector('[data-name]').value).toLowerCase().includes(q));});};
function valid(){const empty=changes().find(p=>p.action!=='remove'&&!p.name);if(empty){feedback('יש למלא שם או לסמן להסרה: '+empty.originalName);document.querySelector('[data-name="'+empty.id+'"]').focus();return false;}return true;}
document.querySelector('#copy').onclick=async()=>{if(!valid())return;const edited=changes().filter(p=>p.action!=='keep');const text=edited.map(p=>p.originalName+' → '+(p.action==='remove'?'להסיר':p.name)).join('\n');if(!text){feedback('עדיין לא שינית שמות');return;}try{await navigator.clipboard.writeText(text);feedback('הועתק. אפשר להדביק כאן בשיחה כדי שאעדכן את השמות באתר.');}catch{const fallback=document.querySelector('#copy-text');fallback.hidden=false;fallback.value=text;fallback.focus();fallback.select();feedback('אפשר להעתיק מהתיבה ולהדביק בשיחה.');}};
document.querySelector('#download').onclick=()=>{if(!valid())return;const blob=new Blob([JSON.stringify(changes(),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='five-stars-names.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);feedback('הקובץ מוכן. אפשר לצרף אותו בשיחה כדי שאעדכן את השמות באתר.');};
save();
</script></body></html>
