<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151515"><title>חמישה כוכבים · שמות המשתתפים</title><style>@import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#151515;color:#f3eee8;font-family:Rubik,Arial,sans-serif}main{max-width:800px;margin:auto;padding:28px 22px 160px}h1{font-size:32px;margin:12px 0 16px;color:#f1b9f3}.hint{color:#b5b0ac;font-size:13px;line-height:1.7}input,button,textarea{font:inherit}#search{width:100%;padding:15px 20px;color:white;background:#292929;border:1px solid #666;border-radius:30px;margin:14px 0}.name-row{border-bottom:1px solid #393939;padding:18px 0}.name-row>label{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:10px}.number{color:#dce58a;font-size:12px;min-width:22px}.edit-row{display:flex;align-items:center;gap:12px}.edit-row>input{width:100%;min-width:0;background:#292929;color:#fff;border:1px solid #777;border-radius:16px;padding:13px 15px;min-height:48px;font-size:16px}.remove{display:flex;align-items:center;gap:7px;font-size:12px;white-space:nowrap;min-height:48px}.remove input{width:20px;height:20px;accent-color:#f1b9f3}button{border:0;border-radius:30px;padding:14px 20px;min-height:48px;cursor:pointer;background:#f1b9f3;color:#151515;font-weight:600}button:focus-visible,input:focus-visible{outline:3px solid #397ff0;outline-offset:3px}footer{position:fixed;bottom:0;right:0;left:0;background:#151515f5;border-top:1px solid #444;padding:12px 20px max(14px,env(safe-area-inset-bottom));z-index:2}.footer-inner{max-width:756px;margin:auto}.buttons{display:flex;gap:10px}.buttons button{flex:1;font-size:13px}#download{background:#dce58a}#message{font-size:12px;line-height:1.6;min-height:20px;color:#ccc;margin:7px 0 0}#copy-text{display:block;width:100%;min-height:110px;background:#292929;color:#fff;border:1px solid #777;border-radius:16px;padding:12px;margin-top:14px}#copy-text[hidden],[hidden]{display:none!important}@media(min-width:650px){.name-row{display:grid;grid-template-columns:1fr 1.5fr;gap:20px;align-items:center}.name-row>label{margin:0}}</style></head><body><main><h1>שמות המשתתפים</h1><p class="hint">הוספת שם מתעדכנת בכל הממשקים.<br>שינוי שם קיים או סימון להסרה נשמרים כטיוטה במכשיר הזה. בסיום, העתיקי את השינויים ושלחי לי כאן.</p><form id="add-person-form" class="edit-row" hidden><input id="new-person-name" placeholder="שם מלא" aria-label="שם מלא להוספה" maxlength="80" required><button type="submit">הוספת שם</button></form><input id="search" type="search" placeholder="חיפוש שם" aria-label="חיפוש משתתף"><div id="names"></div><textarea id="copy-text" aria-label="שינויים להעתקה" readonly hidden></textarea></main><footer><div class="footer-inner"><div class="buttons"><button id="copy">העתקת השינויים</button><button id="download">הורדת הרשימה</button></div><p id="message" role="status" aria-live="polite"></p></div></footer><script type="module">
import {connectGoogleStore} from '../google-store.js';
import {createPeopleClient,activePeople} from '../people.js';
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function start(){
const response=await fetch('../catalog.json');if(!response.ok)throw Error('לא הצלחנו לטעון את השמות');
const catalog=await response.json();const client=createPeopleClient(globalThis.FIVE_STARS_STORAGE_URL?connectGoogleStore(globalThis.FIVE_STARS_STORAGE_URL):null,catalog.people);catalog.people=await client.load();const people=activePeople(catalog);
document.querySelector('#names').innerHTML=people.map((p,i)=>`<section class="name-row" data-id="${escape(p.id)}"><label for="name-${escape(p.id)}"><span class="number">${i+1}</span><span dir="auto">${escape(p.name)}</span></label><div class="edit-row"><input id="name-${escape(p.id)}" data-name="${escape(p.id)}" value="${escape(p.name)}" aria-label="איך לקרוא ל${escape(p.name)}" autocomplete="off"><label class="remove"><input type="checkbox" data-remove="${escape(p.id)}">להסיר</label></div></section>`).join('');
const add=document.querySelector('#add-person-form');add.hidden=!client.supported;
add.onsubmit=async e=>{e.preventDefault();const button=add.querySelector('button');button.disabled=true;try{await client.add(document.querySelector('#new-person-name').value);location.reload();}catch(error){document.querySelector('#message').textContent=error.message;button.disabled=false;}};

const key='five-stars:name-list:v2';
let draft={};let persistent=true;
try{draft=JSON.parse(localStorage.getItem(key)||'{}');}catch{persistent=false;}
const message=document.querySelector('#message');
function feedback(text){message.textContent=text;}
function changes(){return people.map(p=>{const name=document.querySelector('[data-name="'+p.id+'"]').value.trim();const remove=document.querySelector('[data-remove="'+p.id+'"]').checked;return {id:p.id,originalName:p.name,name:remove?'':name,action:remove?'remove':name===p.name?'keep':'rename'};});}
function save(){draft=Object.fromEntries(changes().map(p=>[p.id,{name:p.name,remove:p.action==='remove'}]));try{localStorage.setItem(key,JSON.stringify(draft));persistent=true;}catch{persistent=false;}const count=changes().filter(p=>p.action!=='keep').length;feedback(count+' שינויים · '+(persistent?'טיוטה במכשיר הזה':'לא נשמר — יש להעתיק או להוריד לפני הסגירה'));}
for(const p of people){const d=draft[p.id];if(d){document.querySelector('[data-name="'+p.id+'"]').value=d.remove?p.name:(d.name??p.name);document.querySelector('[data-remove="'+p.id+'"]').checked=!!d.remove;}}
document.querySelectorAll('[data-name],[data-remove]').forEach(input=>input.addEventListener('input',save));
document.querySelector('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.name-row').forEach(row=>{const p=people.find(p=>p.id===row.dataset.id);row.hidden=!((p.name+' '+row.querySelector('[data-name]').value).toLowerCase().includes(q));});};
function valid(){const empty=changes().find(p=>p.action!=='remove'&&!p.name);if(empty){feedback('יש למלא שם או לסמן להסרה: '+empty.originalName);document.querySelector('[data-name="'+empty.id+'"]').focus();return false;}return true;}
document.querySelector('#copy').onclick=async()=>{if(!valid())return;const edited=changes().filter(p=>p.action!=='keep');const text=edited.map(p=>p.originalName+' → '+(p.action==='remove'?'להסיר':p.name)).join('\n');if(!text){feedback('עדיין לא שינית שמות');return;}try{await navigator.clipboard.writeText(text);feedback('הועתק. אפשר להדביק כאן בשיחה כדי שאעדכן את השמות באתר.');}catch{const fallback=document.querySelector('#copy-text');fallback.hidden=false;fallback.value=text;fallback.focus();fallback.select();feedback('אפשר להעתיק מהתיבה ולהדביק בשיחה.');}};
document.querySelector('#download').onclick=()=>{if(!valid())return;const blob=new Blob([JSON.stringify(changes(),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='five-stars-names.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);feedback('הקובץ מוכן. אפשר לצרף אותו בשיחה כדי שאעדכן את השמות באתר.');};
save();
}
start().catch(e=>{document.querySelector('#message').textContent=e.message;});
</script></body></html>
