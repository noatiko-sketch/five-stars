<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151515"><title>3 כוכבים · סטטיסטיקות</title><meta property="og:type" content="website"><meta property="og:title" content="3 כוכבים · סטטיסטיקות"><meta property="og:image" content="https://noatiko-sketch.github.io/five-stars/share-cover-v3.jpg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="3 כוכבים · סטטיסטיקות"><link rel="stylesheet" href="../style.css"></head><body class="stats-page"><div id="stats-entry"><p class="loading" role="status">טוענים את שמות המשתתפים…</p></div>
<main class="wrap" id="stats-content" hidden>
  <div class="stats-account">
    <h1 id="stats-title" tabindex="-1">שלב התוצאות</h1>
    <button type="button" class="identity" id="stats-identity"></button>
  </div>
  <div class="stats-controls">
    <div class="stats-views" role="tablist" aria-label="תצוגת תוצאות">
      <button type="button" role="tab" id="stats-songs-tab" aria-controls="stats-songs-panel" aria-selected="true">שירים</button>
      <button type="button" role="tab" id="stats-personal-tab" aria-controls="stats-personal-panel" aria-selected="false" tabindex="-1">אני ביחס לקבוצה</button>
    </div>
    <div class="ranking-tabs" role="group" aria-label="דירוג לפי">
      <button type="button" data-sort="score" aria-pressed="true">הכי הרבה כוכבים</button>
      <button type="button" data-sort="votes" aria-pressed="false">הכי הרבה הצבעות</button>
      <button type="button" data-sort="loves" aria-pressed="false">הכי הרבה &quot;ממש אהבתי&quot;</button>
    </div>
  </div>
  <p class="ranking-description" aria-live="polite">דירוג השירים שקיבלו הכי הרבה כוכבים</p>
  <p class="score-key">ממש אהבתי = 2 כוכבים · אהבתי = כוכב אחד</p>
  <p class="empty" id="stats-status" role="status" hidden></p>
  <div role="tabpanel" id="stats-songs-panel" aria-labelledby="stats-songs-tab" tabindex="0">
    <div id="stats-ranking"></div>
  </div>
  <div role="tabpanel" id="stats-personal-panel" aria-labelledby="stats-personal-tab" tabindex="0" hidden>
    <section id="stats-summary" aria-label="דירוג אישי" aria-live="polite"></section>
    <div id="stats-personal-songs"></div>
  </div>
</main>
<dialog id="voter-dialog" aria-labelledby="voter-dialog-title"></dialog>
<script type="module" src="stats.js"></script></body></html>
